<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EduPulse AI</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2ff;
  margin: 0;
  padding: 20px;
  color: #172554;
}

.container {
  max-width: 600px;
  margin: 50px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #0002;
}

h1 {
  color: #4f46e5;
  text-align: center;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

#answer {
  margin-top: 20px;
  padding: 15px;
  background: #eef2ff;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎓 EduPulse AI</h1>

<p style="text-align:center">
Your AI-powered learning assistant
</p>

<textarea id="question"
placeholder="Ask a question about your studies..."></textarea>

<button onclick="askQuestion()">
Ask EduPulse AI
</button>

<div id="answer">
Your answer will appear here.
</div>

</div>

<script>
function askQuestion() {

  const question =
    document.getElementById("question").value.trim();

  const answer =
    document.getElementById("answer");

  if (!question) {
    answer.innerText = "Please enter a question.";
    return;
  }

  answer.innerText =
    "EduPulse AI Demo\n\n" +
    "Your question: " + question +
    "\n\nThis is a prototype. " +
    "Connect an AI service to get real answers.";
}
</script>

</body>
</html>
